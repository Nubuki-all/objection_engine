[tool.poetry]
name = "objection_engine"
version = "3.5.1"
description = "Library that turns comment chains into Ace Attorney scenes, used in several bots"
authors = ["Luis Mayo Valbuena <luismayovalbuena@outlook.es>", "Malcolm Anderson <malcolminyo@gmail.com>"]
license = "MIT"

[tool.poetry.dependencies]
python = "~3.12"
spaw = ">=0.2"
Pillow = ">=11.1.0"
matplotlib = ">=3.10.0"
pydub = ">=0.25.1"
moviepy = ">=2.1.2"
ffmpeg-python = ">=0.2.0"
spacy = ">=3.8.0"
textblob = ">=0.20.0"
praw = ">=7.8.0"
tinydb = ">=4.8.2"
google-cloud-translate = ">=3.19.0"
opencv-python = ">=4.11.0"
fonttools = ">=4.63.0"
numpy = ">=2.0.0"
rich = ">=15.0.0"
requests = ">=2.32.3"
toml = ">=0.10.2"
polyglot = { version = ">=16.7.4", optional = true }
pyicu = { version = ">=2.14", optional = true }
pycld2 = { version = ">=0.42", optional = true }
morfessor = { version = ">=2.0.6", optional = true }
transformers = ">=4.45.0"
torch = ">=2.2.0"
sentencepiece = ">=0.2.0"
lxml = ">=6.1.0"
huggingface-hub = "0.23.5"

[tool.poetry.extras]
languages = ["polyglot", "pyicu", "pycld2", "morfessor"]

[tool.poetry.group.dev.dependencies]
black = {version = "^23.1a1", allow-prereleases = true}

[build-system]
requires = ["poetry-core>=1.0.0", "cython>=0.29.28"]
build-backend = "poetry.core.masonry.api"
